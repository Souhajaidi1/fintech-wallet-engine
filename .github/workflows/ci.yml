name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn -B clean compile

      - name: Unit tests
        run: mvn -B test

      # `verify` runs the failsafe integration tests and then packages the jar.
      # The *IT classes start a real PostgreSQL through Testcontainers, which
      # works here because Docker is already available on the GitHub runner.
      - name: Integration tests and package
        run: mvn -B verify

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fintech-wallet-engine-jar
          path: target/*.jar
          retention-days: 7

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Built but not pushed: there is no registry to publish to, and a workflow
      # that pretends to deploy somewhere it does not is worse than none.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fintech-wallet-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
